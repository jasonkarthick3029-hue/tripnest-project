<!-- HOTELS FORM -->
<form id="hotelsForm" class="search-form hidden" data-type="hotels">
  <div class="field">
    <label>City</label>
    <input type="text" name="city" placeholder="Goa" required>
  </div>
  <div class="field">
    <label>Check-in</label>
    <input type="date" name="checkin" required>
  </div>
  <div class="field">
    <label>Check-out</label>
    <input type="date" name="checkout" required>
  </div>
  <button type="submit" class="btn-search">Search Hotels</button>
</form>
