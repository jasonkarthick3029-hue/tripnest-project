<!-- ============ RESULTS PAGE ============ -->
<section id="resultsPage" class="results-page hidden">
  <div class="results-page-bar">
    <button id="backToSearchBtn" class="btn-back">&larr; New Search</button>
    <div class="results-page-summary" id="resultsPageSummary"></div>
  </div>
  <main class="results-wrap">
    <div id="resultsHeader" class="results-header hidden">
      <h2 id="resultsTitle"></h2>
      <span id="resultsCount"></span>
    </div>
    <div id="resultsList" class="results-list"></div>
    <div id="emptyState" class="empty-state hidden">
      <p>No results found. Try a different search.</p>
    </div>
  </main>
</section>
