<!-- BUSES FORM -->
<form id="busesForm" class="search-form hidden" data-type="buses">
  <div class="field">
    <label>From</label>
    <input type="text" name="origin" placeholder="Delhi" required>
  </div>
  <div class="field">
    <label>To</label>
    <input type="text" name="destination" placeholder="Manali" required>
  </div>
  <div class="field">
    <label>Date</label>
    <input type="date" name="travel_date" required>
  </div>
  <button type="submit" class="btn-search">Search Buses</button>
</form>
