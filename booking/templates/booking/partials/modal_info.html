<!-- ============ CHECK-IN / FLIGHT STATUS ============ -->
<div id="infoModal" class="modal hidden">
  <div class="modal-box info-modal-box">
    <button class="modal-close" id="closeInfoModal">&times;</button>

    <div id="checkinPanel" class="info-panel">
      <div class="info-hero-icon">✈</div>
      <div class="flow-kicker">TRIPNEST · ONLINE CHECK-IN</div>
      <h3>Ready to fly?</h3>
      <p class="book-summary">Check in online using your TripNest flight booking reference.</p>
      <div class="info-steps"><span class="active">1</span><i></i><span>2</span><i></i><span>3</span></div>
      <form id="checkinForm" class="modal-form">
        <label class="checkout-field"><span>Booking reference</span><input type="text" name="booking_ref" placeholder="e.g. TN202609150001" required></label>
        <button type="submit" class="btn-primary">Check in online →</button>
        <p class="form-msg" id="checkinMsg"></p>
      </form>
      <div class="info-note">🔒 Secure check-in · Your boarding pass will be generated by the booking system.</div>
    </div>

    <div id="statusPanel" class="info-panel hidden">
      <div class="info-hero-icon status-icon">◷</div>
      <div class="flow-kicker">TRIPNEST · LIVE STATUS</div>
      <h3>Flight status</h3>
      <p class="book-summary">Enter a flight number to view its latest demo status.</p>
      <form id="statusForm" class="modal-form">
        <label class="checkout-field"><span>Flight number</span><input type="text" name="flight_number" placeholder="e.g. 6E-201" required></label>
        <label class="checkout-field"><span>Travel date</span><input type="date" name="travel_date"></label>
        <button type="submit" class="btn-primary">Check flight status →</button>
        <p class="form-msg" id="statusMsg"></p>
      </form>
      <div id="statusResult" class="status-result hidden"></div>
    </div>
  </div>
</div>
