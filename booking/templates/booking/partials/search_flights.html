<!-- FLIGHTS FORM -->
<form id="flightsForm" class="search-form" data-type="flights">
  <div class="field">
    <label>From</label>
    <input type="text" name="origin" placeholder="Delhi" required>
  </div>
  <div class="field">
    <label>To</label>
    <input type="text" name="destination" placeholder="Mumbai" required>
  </div>
  <div class="field">
    <label>Departure</label>
    <input type="date" name="travel_date" required>
  </div>
  <button type="submit" class="btn-search">Search Flights</button>
</form>
